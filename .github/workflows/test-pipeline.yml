name: Regresión Funcional E2E - Portal de Pagos

on:
  push:
    branches:
      - main

jobs:
  automation-test:
    name: Automatización E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Levantar servicios Docker
        run: docker compose up -d # Esto leerá tu archivo docker-compose.yml

      - name: Esperar servicios
        run: sleep 30

      - name: Ejecutar pruebas Maven
        run: mvn clean test 